workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Build Flutter APK Automatically
        script: |
          # البحث التلقائي عن مسار المشروع الذي يحتوي على ملف pubspec.yaml
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "تم العثور على المشروع في المسار: $PROJECT_DIR"
          
          # الانتقال للمجلد وتشغيل الأوامر
          cd $PROJECT_DIR
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/app-release.apk"
