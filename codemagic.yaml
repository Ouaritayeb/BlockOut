workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          cd artifacts/shade-lock/block_out
          flutter pub get
      - name: Build APK
        script: |
          cd artifacts/shade-lock/block_out
          flutter build apk --release
    artifacts:
      - artifacts/shade-lock/block_out/build/app/outputs/flutter-apk/app-release.apk
