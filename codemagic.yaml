workflows:
  build-apk:
    name: Build Android APK
    max_build_duration: 30
    environment:
      flutter: 3.19.6
    scripts:
      - name: Build Flutter APK Automatically
        script: |
          PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" | head -n 1))
          echo "Found project at: $PROJECT_DIR"
          cd $PROJECT_DIR
          flutter pub get
          flutter build apk --release
    artifacts:
      - "**/app-release.apk"
